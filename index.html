  <script>
           window.__showAppError = function(details) {
      var el = document.getElementById('app');
      if (!el || el.dataset.hasError) return;
      el.dataset.hasError = '1';
      el.innerHTML =
        '<section class="hero" style="max-width:420px;margin:0 auto;padding:18px 16px;text-align:center;">' +
          '<div style="width:220px;max-width:75%;margin:0 auto 12px;border-radius:18px;overflow:hidden;">' +
            '<img src="./js/geese/goose_error.jpg?v=2" alt="Гусь охотится на баги" style="width:100%;height:auto;display:block;mix-blend-mode:multiply;pointer-events:none;">' +
          '</div>' +
                    '<h2 style="margin:0 0 6px;font-size:22px;color:var(--fg);">出事了！</h2>' +
          '<p style="margin:0 0 14px;font-size:14px;line-height:1.45;color:var(--muted);">Гусь уже вышел на охоту за багами! Ждите, скоро всё починим! 🦆</p>' +
          '<div id="crashFeedbackSlot" class="box" style="padding:12px;margin:0 0 10px;text-align:left;">' +
            '<div style="font-size:13px;font-weight:700;color:var(--fg);margin-bottom:6px;">Написать разработчику</div>' +
            '<textarea id="crashText" rows="2" placeholder="Расскажи, что нажал перед ошибкой..." style="width:100%;box-sizing:border-box;padding:9px 10px;border-radius:10px;border:1px solid var(--border);font-size:14px;font-family:inherit;background:#fff;color:var(--fg);"></textarea>' +
            '<button id="crashSendBtn" type="button" class="cta" style="width:100%;margin-top:8px;padding:10px;font-size:14px;border:none;cursor:pointer;">Отправить в поддержку</button>' +
            '<div id="crashStatus" style="font-size:12px;font-weight:600;margin-top:6px;text-align:center;"></div>' +
          '</div>' +
          '<button onclick="(navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}):Promise.resolve()).then(function(){return window.caches?caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}):null}).finally(function(){location.reload()})" class="ghost" style="width:100%;padding:10px;">Обновить страницу</button>' +
          '<a href="https://alinalinkova0-spec.github.io/audio-hsk/" class="cta" style="display:block;width:100%;box-sizing:border-box;padding:11px 10px;margin-top:8px;text-decoration:none;font-size:14px;">🦆 Открыть запасное зеркало сайта</a>' +
          (details ? '<div style="margin-top:10px;font-size:11px;color:var(--muted);opacity:0.75;word-break:break-word;">' + String(details).replace(/</g, '&lt;') + '</div>' : '') +
        '</section>';

      var sendBtn = document.getElementById('crashSendBtn');
      if (sendBtn) {
        sendBtn.onclick = function() {
          var txt = (document.getElementById('crashText').value || '').trim();
          var st = document.getElementById('crashStatus');
          if (!txt) { st.style.color = '#B42318'; st.textContent = 'Напиши пару слов о проблеме'; return; }
          sendBtn.disabled = true;
          st.style.color = 'var(--jade)';
          st.textContent = 'Отправляем...';
          import('./js/feedback.js?v=2').then(function(m) {
            return m.sendTelegramReport({ text: '🆘 С экрана ошибки:\n' + txt + '\n\nДетали: ' + (details || '') });
          }).then(function(res) {
            sendBtn.disabled = false;
            st.style.color = res && res.ok ? 'var(--jade)' : '#B42318';
            st.textContent = (res && res.message) || 'Отправлено ✓';
            if (res && res.ok) document.getElementById('crashText').value = '';
          }).catch(function() {
            sendBtn.disabled = false;
            st.style.color = '#B42318';
            st.textContent = 'Не удалось отправить, попробуй обновить страницу';
          });
        };
      }

      import('./js/feedback.js?v=2').then(function(m) {
        if (m.reportAutoCrash) m.reportAutoCrash(details);
        if (m.renderFeedbackBox) {
          m.renderFeedbackBox(document.getElementById('crashFeedbackSlot'), {
            title: 'Расскажи, что нажал перед ошибкой',
            placeholder: 'Например: нажал на карточку в HSK 2...'
          });
        }
      }).catch(function() {});
    };
    window.addEventListener('error', function(e) {
      var el = document.getElementById('app');
      if (el && !el.innerHTML.trim()) window.__showAppError(e.message || 'Ошибка скрипта');
    });
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('app');
      if (el && !el.innerHTML.trim()) window.__showAppError((e.reason && e.reason.message) || e.reason || 'Ошибка загрузки');
    });
  </script>
    <script type="module">
    async function bootApp(attempt) {
      try {
        const target = attempt === 0 ? './js/app.js?v=110' : './js/app.js';
        await import(target);
      } catch (err) {
        if (attempt < 1) {
          setTimeout(function() { bootApp(attempt + 1); }, 300);
          return;
        }
        if (window.__showAppError) window.__showAppError(err);
      }
    }
    bootApp(0);
  </script>
